[project]
name = "freecad-mcp-hardened"
version = "0.1.26+hardened.1"
description = "Security-hardened fork of freecad-mcp: mandatory auth token, no headless execution, RPC limits and a code filter"
readme = "README.md"
authors = [
    { name = "neka-nat", email = "nekanat.stock@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.28.1,<3",
    "validators>=0.34.0",
]

[project.scripts]
freecad-mcp = "freecad_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/freecad_mcp"]

[tool.hatch.build.targets.sdist]
exclude = ["assets", "results"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
